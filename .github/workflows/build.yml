name: Build HavocMaintenance

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show repository layout
        run: find . -path ./.git -prune -o -type f -print | sort

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: mvn -B --no-transfer-progress clean package

      - name: List jar contents
        run: unzip -l target/*.jar

      - name: Verify plugin.yml is inside the jar
        run: unzip -l target/*.jar | grep -qE ' plugin\.yml$' || (echo "ERROR - plugin.yml is missing. It must be at src/main/resources/plugin.yml" && exit 1)

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: HavocMaintenance-jar
          path: target/*.jar
          if-no-files-found: error
